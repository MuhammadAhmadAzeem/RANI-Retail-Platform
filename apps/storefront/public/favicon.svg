
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="burgundy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#250810"/>
      <stop offset="52%" stop-color="#4A1420"/>
      <stop offset="100%" stop-color="#6B1F2A"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0DDAE"/>
      <stop offset="48%" stop-color="#B08D57"/>
      <stop offset="100%" stop-color="#8C6938"/>
    </linearGradient>

    <linearGradient id="brightWhite" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F3EC"/>
    </linearGradient>

    <filter id="whiteGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="blur"/>
      <feFlood flood-color="#FFFFFF" flood-opacity=".3" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep burgundy background -->
  <rect width="64" height="64" rx="12" fill="url(#burgundy)"/>

  <!-- Outer antique-gold frame -->
  <rect
    x="4.5"
    y="4.5"
    width="55"
    height="55"
    rx="8"
    fill="none"
    stroke="url(#gold)"
    stroke-width="1"
  />

  <!-- Subtle inner frame -->
  <rect
    x="8"
    y="8"
    width="48"
    height="48"
    rx="5"
    fill="none"
    stroke="#D5B77E"
    stroke-opacity=".22"
    stroke-width=".6"
  />

  <!-- Enhanced bright ivory monogram -->
  <text
    x="32"
    y="45"
    fill="url(#brightWhite)"
    stroke="#FFFFFF"
    stroke-opacity=".7"
    stroke-width=".35"
    paint-order="stroke fill"
    filter="url(#whiteGlow)"
    font-family="Bodoni MT, Didot, Georgia, 'Times New Roman', serif"
    font-size="42"
    font-weight="400"
    text-anchor="middle"
  >B</text>

  <!-- Clean gold signature line; no dot -->
  <path
    d="M25 51.5H39"
    fill="none"
    stroke="url(#gold)"
    stroke-width="1"
    stroke-linecap="round"
  />
</svg>
